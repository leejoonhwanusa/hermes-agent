name: basic
version: 1.0.0
description: "Dashboard auth provider — username/password (no OAuth IDP). A self-hosted 'just put a password on my dashboard' provider. Activates when dashboard.basic_auth.username plus a password (or password_hash) are configured via config.yaml (canonical surface) or the HERMES_DASHBOARD_BASIC_AUTH_* env vars. Sessions are HMAC-signed tokens backed by a profile-local active-session file for persistent logout revocation; password hashing uses stdlib scrypt (no third-party dependency). Set dashboard.basic_auth.secret and share the profile session file for restart-surviving / multi-worker sessions. Legacy stateless sessions require a new login."
author: NousResearch
kind: backend
requires_env:
  - HERMES_DASHBOARD_BASIC_AUTH_USERNAME
