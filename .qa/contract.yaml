schema_version: 1
project_id: hermes-agent
risk_class: high
safety:
  default_mode: read_only
  external_network: deny_unless_declared
  commerce_mutation: deny
  database_mutation: deny
  trade_mutation: deny
evidence:
  source_commit: required
  runtime_identity: required
  artifact_digest: required
  required_kinds_by_driver:
    process: [stdout]
    manual: [manual_log]
metadata:
  scope: Installed Hermes Agent source checkout on HANILSERVER; no service mutation from QA profiles.
  test_environment: PM-selected test generation pinned in the approved profiles; re-register on generation change.
approved_profiles:
  gateway_recovery_regression:
    description: Canonical isolated regression for Gateway loop liveness and shutdown watchdog behavior.
    interpreter: C:/Program Files/Git/usr/bin/bash.exe
    command_argv:
      - -c
      - "HERMES_PYTHON=/c/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/python.exe exec scripts/run_tests.sh tests/gateway/test_loop_liveness_watchdog.py tests/gateway/test_shutdown_watchdog.py"
    working_directory: .
    timeout_seconds: 1800
    execution_authority: read_only
    driver: process
  gateway_recovery_ruff:
    description: Scoped Ruff for the shutdown watchdog source and its two affected Gateway tests.
    interpreter: C:/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/ruff.exe
    command_argv: [check, gateway/shutdown_watchdog.py, tests/gateway/test_loop_liveness_watchdog.py, tests/gateway/test_shutdown_watchdog.py]
    working_directory: .
    timeout_seconds: 300
    execution_authority: read_only
    driver: process
