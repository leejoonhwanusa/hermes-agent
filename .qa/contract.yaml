schema_version: 1
project_id: hermes-agent
risk_class: high
safety:
  default_mode: read_only
  external_network: deny_unless_declared
  commerce_mutation: deny
  database_mutation: deny
  trade_mutation: deny
evidence:
  source_commit: required
  runtime_identity: required
  artifact_digest: required
  required_kinds_by_driver:
    process: [stdout]
    manual: [manual_log]
metadata:
  scope: Installed Hermes Agent source checkout on HANILSERVER; no service mutation from QA profiles.
  test_environment: PM-selected test generation pinned in the approved profiles; re-register on generation change.
approved_profiles:
  gateway_recovery_regression:
    description: Official update regression for session and maintenance leases, compression commit fencing, profile-scoped startup, Windows Gateway/update policy, source checks and unreachable cron retries; no live Task creation.
    interpreter: C:/Program Files/Git/usr/bin/bash.exe
    command_argv:
      - -c
      - "HERMES_PYTHON=/c/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/python.exe exec /usr/bin/bash scripts/run_tests.sh -j 1 --file-retries 0 tests/hermes_state/test_session_turn_lease.py tests/hermes_state/test_startup_maintenance_lease.py tests/hermes_state/test_state_db_second_process_maintenance.py tests/hermes_state/test_compression_lease_refresh_before_publish.py tests/hermes_state/test_compression_lineage_guard.py tests/hermes_state/test_compression_watermark_commit.py tests/hermes_state/test_lease_pid_namespace.py tests/agent/test_compression_commit_fence_race.py tests/gateway/test_startup_launch_profile_hooks_scope.py tests/gateway/test_startup_warmup_profile_scope.py tests/gateway/test_launch_profile_scope_fallback.py tests/gateway/test_platform_registry.py tests/hermes_cli/test_gateway_windows.py tests/hermes_cli/test_gateway_restart_external_supervisor.py tests/hermes_cli/test_update_no_gateway_restart.py tests/hermes_cli/test_update_parked_branch_guard.py tests/hermes_cli/test_source_check.py tests/cron/test_unreachable_retry.py -- -v --tb=short -k 'not test_exec_schtasks_round_trips_non_ascii_task_argument_live'"
    working_directory: .
    timeout_seconds: 1800
    execution_authority: read_only
    driver: process
  gateway_recovery_ruff:
    description: Scoped Ruff for the official update's affected state, compression, startup, Windows Gateway/update and cron source boundaries plus the eighteen selected regression files.
    interpreter: C:/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/ruff.exe
    command_argv:
      - check
      - hermes_state_common.py
      - hermes_state_compression.py
      - hermes_state_gateway.py
      - hermes_state_maintenance.py
      - hermes_state_pidns.py
      - hermes_state_sessions.py
      - hermes_state_portability.py
      - agent/conversation_compression.py
      - gateway/run_adapters.py
      - gateway/run_startup.py
      - gateway/platform_registry.py
      - hermes_cli/gateway.py
      - hermes_cli/web_server_chat.py
      - cron/unreachable_retry.py
      - tests/hermes_state/test_session_turn_lease.py
      - tests/hermes_state/test_startup_maintenance_lease.py
      - tests/hermes_state/test_state_db_second_process_maintenance.py
      - tests/hermes_state/test_compression_lease_refresh_before_publish.py
      - tests/hermes_state/test_compression_lineage_guard.py
      - tests/hermes_state/test_compression_watermark_commit.py
      - tests/hermes_state/test_lease_pid_namespace.py
      - tests/agent/test_compression_commit_fence_race.py
      - tests/gateway/test_startup_launch_profile_hooks_scope.py
      - tests/gateway/test_startup_warmup_profile_scope.py
      - tests/gateway/test_launch_profile_scope_fallback.py
      - tests/gateway/test_platform_registry.py
      - tests/hermes_cli/test_gateway_windows.py
      - tests/hermes_cli/test_gateway_restart_external_supervisor.py
      - tests/hermes_cli/test_update_no_gateway_restart.py
      - tests/hermes_cli/test_update_parked_branch_guard.py
      - tests/hermes_cli/test_source_check.py
      - tests/cron/test_unreachable_retry.py
    working_directory: .
    timeout_seconds: 300
    execution_authority: read_only
    driver: process
  dashboard_auth_regression:
    description: Pinned PM regression for dashboard-auth sessions, provider lifecycle, WebSocket tickets, and display ownership.
    interpreter: C:/Program Files/Git/usr/bin/bash.exe
    command_argv:
      - -c
      - "HERMES_PYTHON=/c/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/python.exe exec /usr/bin/bash scripts/run_tests.sh -j 1 --file-retries 0 tests/plugins/dashboard_auth/test_basic_provider.py tests/hermes_cli/test_dashboard_auth_password_login.py tests/hermes_cli/test_refresh_singleflight.py tests/hermes_cli/test_dashboard_auth_ws_tickets.py tests/hermes_cli/test_dashboard_auth_ws_auth.py tests/hermes_cli/test_dashboard_auth_middleware.py tests/hermes_cli/test_dashboard_auth_plugin_hook.py tests/hermes_cli/test_web_server_idle_exit.py tests/hermes_cli/test_display_ws_ticket.py tests/hermes_cli/test_ws_auth_display_ticket.py tests/hermes_cli/test_display_ws_drop_keeps_lease.py tests/tui_gateway/test_display_methods.py -- -v --tb=short"
    working_directory: .
    timeout_seconds: 900
    execution_authority: read_only
    driver: process
  dashboard_auth_ruff:
    description: Scoped Ruff for current changed Python paths and the twelve selected dashboard-auth regression files.
    interpreter: C:/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/ruff.exe
    command_argv:
      - check
      - hermes_cli/dashboard_auth/base.py
      - hermes_cli/dashboard_auth/refresh_singleflight.py
      - hermes_cli/dashboard_auth/routes.py
      - hermes_cli/dashboard_auth/ws_tickets.py
      - hermes_cli/web_routers/display.py
      - hermes_cli/web_server.py
      - hermes_cli/web_server_chat.py
      - plugins/dashboard_auth/basic/__init__.py
      - tui_gateway/methods_display.py
      - tui_gateway/ws.py
      - tests/hermes_cli/test_dashboard_auth_password_login.py
      - tests/hermes_cli/test_dashboard_auth_ws_auth.py
      - tests/hermes_cli/test_dashboard_auth_ws_tickets.py
      - tests/hermes_cli/test_display_ws_ticket.py
      - tests/plugins/dashboard_auth/test_basic_provider.py
      - tests/hermes_cli/test_refresh_singleflight.py
      - tests/hermes_cli/test_dashboard_auth_middleware.py
      - tests/hermes_cli/test_dashboard_auth_plugin_hook.py
      - tests/hermes_cli/test_web_server_idle_exit.py
      - tests/hermes_cli/test_ws_auth_display_ticket.py
      - tests/hermes_cli/test_display_ws_drop_keeps_lease.py
      - tests/tui_gateway/test_display_methods.py
    working_directory: .
    timeout_seconds: 300
    execution_authority: read_only
    driver: process
  dashboard_auth_windows_regression:
    description: Windows-scoped dashboard-auth regression retaining the twelve-file selection while excluding seven POSIX-only test instances.
    interpreter: C:/Program Files/Git/usr/bin/bash.exe
    command_argv:
      - -c
      - "HERMES_PYTHON=/c/Users/HANILSERVER/AppData/Local/hermes/installs/a8225d1dcfe5b2aa/test-environment/gen-ea37ef5c6269424c91d014c7d00313dd/venv/Scripts/python.exe exec /usr/bin/bash scripts/run_tests.sh -j 1 --file-retries 0 tests/plugins/dashboard_auth/test_basic_provider.py tests/hermes_cli/test_dashboard_auth_password_login.py tests/hermes_cli/test_refresh_singleflight.py tests/hermes_cli/test_dashboard_auth_ws_tickets.py tests/hermes_cli/test_dashboard_auth_ws_auth.py tests/hermes_cli/test_dashboard_auth_middleware.py tests/hermes_cli/test_dashboard_auth_plugin_hook.py tests/hermes_cli/test_web_server_idle_exit.py tests/hermes_cli/test_display_ws_ticket.py tests/hermes_cli/test_ws_auth_display_ticket.py tests/hermes_cli/test_display_ws_drop_keeps_lease.py tests/tui_gateway/test_display_methods.py -- -v --tb=short -k 'not (test_only_a_clean_viewer_close_hands_the_screen_back or test_a_takeover_made_by_another_process_stops_input_within_the_refresh_interval or test_no_bridge_task_or_socket_outlives_the_bridge or test_install_worker_keeps_the_requested_profile_scope or test_install_sudo_card_ignores_a_client_supplied_session_id)'"
    working_directory: .
    timeout_seconds: 900
    execution_authority: read_only
    driver: process
